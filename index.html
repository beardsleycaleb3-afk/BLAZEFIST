<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>FIGHT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { width: 100dvw; height: 100dvh; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    body { position: fixed; inset: 0; }

    #app { width: 100dvw; height: 100dvh; display: flex; flex-direction: column; }

    #screen {
      position: relative;
      flex: 1 1 auto;
      min-height: 58dvh;
      background: linear-gradient(180deg, #10101a, #050508);
      border-bottom: 2px solid #1e1e2a;
      overflow: hidden;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }

    .barWrap { width: 38%; }
    .label { font-size: 10px; margin-bottom: 4px; opacity: .9; }
    .bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      overflow: hidden;
      border-radius: 2px;
    }
    .fill { height: 100%; width: 100%; }
    #p1fill { background: linear-gradient(90deg, #29ff6a, #0a8f2f); }
    #p2fill { background: linear-gradient(90deg, #ff4a4a, #8f0000); }

    #scoreBox { text-align: center; min-width: 78px; }
    #score { font-size: 18px; color: #ffd400; text-shadow: 0 0 10px #ff6a00; }
    #timer { font-size: 14px; color: #fff; }

    #message {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      color: #ffd400;
      font-size: 22px;
      font-weight: 800;
      text-shadow: 0 0 16px #ff6a00;
      opacity: 0;
      z-index: 6;
      pointer-events: none;
    }
    #message.show { animation: pop .7s ease-out; }
    @keyframes pop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(.4); }
      50% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -95%) scale(.9); }
    }

    #controls {
      flex: 0 0 42dvh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: linear-gradient(180deg, #090912, #050508);
      gap: 16px;
    }

    #dpad {
      width: 132px;
      height: 132px;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
    }

    .btn {
      border: 1px solid rgba(255,255,255,.14);
      background: radial-gradient(circle at 35% 35%, #2a2a44, #10101f);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 4px 0 #000;
    }

    .btn:active, .btn.on {
      transform: translateY(3px) scale(.92);
      filter: brightness(1.5);
      box-shadow: 0 1px 0 #000;
    }

    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #center { grid-column: 2; grid-row: 2; background: transparent; box-shadow: none; }
    #right { grid-column: 3; grid-row: 2; }
    #down { grid-column: 2; grid-row: 3; }

    #actions {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .action {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff7a00, #b12a00);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 5px 0 #4a1000;
    }

    .action.run { background: radial-gradient(circle at 35% 35%, #1ca34a, #0b381a); box-shadow: 0 5px 0 #06160a; }
    .action:active, .action.on { transform: translateY(4px) scale(.92); box-shadow: 0 1px 0 #000; }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      gap: 12px;
    }

    #overlay h1 { font-size: 34px; color: #ffd400; text-shadow: 0 0 18px #ff6a00; }
    #overlay p { font-size: 12px; opacity: .85; }
    #overlay button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #ff6a00;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
    }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game"></canvas>

      <div id="hud">
        <div class="barWrap">
          <div class="label">PLAYER</div>
          <div class="bar"><div class="fill" id="p1fill"></div></div>
        </div>

        <div id="scoreBox">
          <div id="score">000000</div>
          <div id="timer">99</div>
        </div>

        <div class="barWrap" style="text-align:right;">
          <div class="label">ENEMY</div>
          <div class="bar"><div class="fill" id="p2fill"></div></div>
        </div>
      </div>

      <div id="message"></div>

      <div id="overlay">
        <h1>FIGHT</h1>
        <p>Touch PLAY to start</p>
        <button id="playBtn">PLAY</button>
      </div>
    </div>

    <div id="controls">
      <div id="dpad">
        <div class="btn" id="up">▲</div>
        <div class="btn" id="left">◀</div>
        <div class="btn" id="center"></div>
        <div class="btn" id="right">▶</div>
        <div class="btn" id="down">▼</div>
      </div>

      <div id="actions">
        <div class="action run" id="runBtn">RUN</div>
        <div class="action" id="attackBtn">HIT</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const ui = {
      p1: document.getElementById('p1fill'),
      p2: document.getElementById('p2fill'),
      score: document.getElementById('score'),
      timer: document.getElementById('timer'),
      msg: document.getElementById('message'),
      overlay: document.getElementById('overlay'),
      playBtn: document.getElementById('playBtn')
    };

    const input = { left:false, right:false, run:false };
    let running = false;
    let score = 0;
    let timer = 99;
    let p1hp = 100;
    let p2hp = 100;
    let x = 70, y = 180, vx = 0;
    let ex = 260, ey = 180, evx = 0;

    const SPRITE_BASE = './assets/sprites/fighter/flaming/east/';
    const STAGE_BG = './assets/sprites/stages/backgrounds/stage1.png';

    const ANIMS = {
      idle: 'idle',
      walk: 'walk',
      run: 'run',
      jump: 'jump',
      jab: 'jab',
      cross: 'cross',
      punch: 'punch',
      kick: 'kick',
      uppercut: 'uppercut',
      headbutt: 'headbutt',
      roundhouse: 'roundhouse',
      victory: 'victory'
    };

    const images = {};
    function makeFrameUrl(action, frame) {
      return `${SPRITE_BASE}${action}/frame_${String(frame).padStart(3, '0')}.png`;
    }

    function loadImage(src) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function preloadSprites() {
      const actions = Object.values(ANIMS);
      for (const action of actions) {
        images[action] = [];
        for (let i = 0; i < 12; i++) {
          const img = await loadImage(makeFrameUrl(action, i));
          if (!img) break;
          images[action].push(img);
        }
      }
      images.stage = await loadImage(STAGE_BG);
    }

    function resize() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function flash(text) {
      ui.msg.textContent = text;
      ui.msg.classList.remove('show');
      void ui.msg.offsetWidth;
      ui.msg.classList.add('show');
    }

    function updateHUD() {
      ui.p1.style.width = p1hp + '%';
      ui.p2.style.width = p2hp + '%';
      ui.score.textContent = String(score).padStart(6, '0');
      ui.timer.textContent = String(timer).padStart(2, '0');
    }

    function drawRect(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(x, y, w, h);
    }

    function render() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      ctx.clearRect(0, 0, w, h);

      if (images.stage) {
        ctx.drawImage(images.stage, 0, 0, w, h);
      } else {
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, '#16162a');
        bg.addColorStop(1, '#050508');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
      }

      ctx.fillStyle = 'rgba(255,255,255,.03)';
      for (let i = 0; i < h; i += 4) ctx.fillRect(0, i, w, 1);

      ctx.fillStyle = '#444';
      ctx.fillRect(0, h - 34, w, 34);

      drawRect(x, y, 28, 48, '#3399ff');
      drawRect(ex, ey, 28, 48, '#ff4444');

      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 6, y + 8, 6, 6);
      ctx.fillRect(ex + 16, ey + 8, 6, 6);
    }

    function loop() {
      if (!running) return;

      const w = canvas.clientWidth;

      vx = 0;
      if (input.left) vx -= input.run ? 3.2 : 2;
      if (input.right) vx += input.run ? 3.2 : 2;
      x = Math.max(12, Math.min(w - 40, x + vx));

      evx = x > ex ? 1.1 : -1.1;
      ex += evx;
      ex = Math.max(12, Math.min(w - 40, ex));

      render();
      requestAnimationFrame(loop);
    }

    function startGame() {
      running = true;
      ui.overlay.style.display = 'none';
      score = 0;
      timer = 99;
      p1hp = 100;
      p2hp = 100;
      x = 70;
      ex = 260;
      updateHUD();
      flash('READY!');
      clearInterval(window._gameTimer);
      window._gameTimer = setInterval(() => {
        if (!running) return;
        timer--;
        updateHUD();
        if (timer <= 0) {
          running = false;
          ui.overlay.style.display = 'flex';
          ui.overlay.querySelector('h1').textContent = p1hp >= p2hp ? 'YOU WIN' : 'GAME OVER';
          ui.overlay.querySelector('p').textContent = 'Touch PLAY to restart';
        }
      }, 1000);
      requestAnimationFrame(loop);
    }

    function bindTouch(id, onDown, onUp) {
      const el = document.getElementById(id);
      el.ontouchstart = e => { e.preventDefault(); el.classList.add('on'); onDown(); };
      el.ontouchend = e => { e.preventDefault(); el.classList.remove('on'); onUp && onUp(); };
      el.ontouchcancel = () => { el.classList.remove('on'); onUp && onUp(); };
      el.ontouchmove = e => { e.preventDefault(); };
    }

    bindTouch('left', () => input.left = true, () => input.left = false);
    bindTouch('right', () => input.right = true, () => input.right = false);
    bindTouch('runBtn', () => input.run = true, () => input.run = false);

    document.getElementById('up').ontouchstart = e => {
      e.preventDefault();
      flash('JUMP');
    };
    document.getElementById('up').ontouchmove = e => {
      e.preventDefault();
      const t = e.touches[0];
      if (!t) return;
      const dy = t.clientY - (window._touchY || t.clientY);
      if (dy < -24) flash('SPECIAL UP');
    };
    document.getElementById('down').ontouchstart = e => {
      e.preventDefault();
      flash('DUCK');
    };
    document.getElementById('down').ontouchmove = e => {
      e.preventDefault();
      const t = e.touches[0];
      if (!t) return;
      const dy = t.clientY - (window._touchY || t.clientY);
      if (dy > 24) flash('SPECIAL DOWN');
    };

    document.getElementById('up').ontouchstart = e => { e.preventDefault(); window._touchY = e.touches[0].clientY; flash('JUMP'); };
    document.getElementById('down').ontouchstart = e => { e.preventDefault(); window._touchY = e.touches[0].clientY; flash('DUCK'); };

    document.getElementById('attackBtn').ontouchstart = e => {
      e.preventDefault();
      if (!running) return;
      const hit = Math.random() > 0.35;
      if (hit) {
        p2hp = Math.max(0, p2hp - 8);
        score += 80;
        flash('HIT!');
      } else {
        flash('MISS');
      }
      updateHUD();
    };

    ui.playBtn.ontouchstart = e => { e.preventDefault(); startGame(); };
    ui.playBtn.ontouchmove = e => { e.preventDefault(); };

    document.addEventListener('touchstart', () => {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }, { once:true, passive:true });

    (async () => {
      await preloadSprites();
      updateHUD();
      render();
    })();
  </script>
</body>
</html>
