<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FF6B00">
<title>BLAZEFIST</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --fo:#FF6B00;--fr:#FF1A00;--fy:#FFD600;
  --pb:#00D4FF;--xp:#B44FFF;--sg:#00D4FF;
  --hg:#39FF14;--hy:#FFD600;--hr:#FF1A00;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100dvw;height:100dvh;overflow:hidden;background:#000;font-family:'Press Start 2P',monospace;}

/* ── LOADER ── */
#loader{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center,#1a0530 0%,#0A0A12 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;z-index:999;transition:opacity 0.6s ease;
}
#loader.fade{opacity:0;pointer-events:none;}
#loader h1{
  font-size:clamp(20px,6vw,36px);color:var(--fy);
  text-shadow:0 0 30px var(--fo),0 0 60px rgba(255,107,0,0.4);
  letter-spacing:6px;animation:lfl 2s ease-in-out infinite;
}
@keyframes lfl{0%,100%{opacity:1;}50%{opacity:0.75;text-shadow:0 0 50px var(--fo),0 0 90px rgba(255,107,0,0.6);}}
.load-sub{font-size:clamp(4px,1.2vw,7px);color:rgba(255,255,255,0.3);letter-spacing:3px;}
#prog-wrap{width:min(300px,70vw);height:14px;background:rgba(0,0,0,0.7);border:1px solid var(--fo);border-radius:20px;overflow:hidden;}
#prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--fr),var(--fo),var(--fy));border-radius:20px;box-shadow:0 0 10px var(--fo);transition:width 0.2s ease-out;}
#load-status{font-size:clamp(4px,1vw,6px);color:rgba(255,200,100,0.55);letter-spacing:1px;text-align:center;max-width:320px;min-height:1.5em;}
#load-assets{font-size:clamp(3px,0.9vw,5px);color:rgba(255,255,255,0.2);letter-spacing:1px;text-align:center;}

/* ── SCALE ROOT ── */
#scale-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#game-wrap{position:relative;flex-shrink:0;transform-origin:center center;}
#game-canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}

/* ── HUD ── */
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
.panel{position:absolute;top:10px;background:rgba(5,5,14,0.9);border:1px solid rgba(255,107,0,0.4);border-radius:3px;padding:6px 9px 8px;min-width:220px;box-shadow:0 0 14px rgba(255,107,0,0.15),inset 0 0 8px rgba(0,0,0,0.5);}
.pl{left:8px;}.pr{right:8px;}
.fname{font-size:5px;color:#fff;letter-spacing:1px;text-shadow:0 0 8px var(--fo);margin-bottom:5px;}
.pr .fname{text-align:right;}
.blbl{font-size:4px;color:rgba(255,255,255,0.35);letter-spacing:1px;margin-bottom:2px;}
.btrk{width:100%;height:10px;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;position:relative;}
.bfil{height:100%;border-radius:1px;transition:width 0.1s ease-out;}
.bfil::after{content:'';position:absolute;top:1px;left:3px;right:3px;height:2px;background:rgba(255,255,255,0.15);border-radius:1px;}
.tks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),rgba(255,255,255,0.04) calc(10% - 1px),rgba(255,255,255,0.04) 10%);pointer-events:none;}
.brow{margin:3px 0;}
#p1-hp{background:linear-gradient(90deg,#004400,var(--hg));box-shadow:0 0 4px var(--hg);}
#p1-xp{background:linear-gradient(90deg,#330066,var(--xp));box-shadow:0 0 4px var(--xp);}
#p2-hp{background:linear-gradient(90deg,#550000,var(--hr));box-shadow:0 0 4px var(--hr);}
#p2-st{background:linear-gradient(90deg,#002244,var(--pb));box-shadow:0 0 4px var(--pb);}
.lrow{display:flex;gap:4px;margin-top:4px;}
.pr .lrow{justify-content:flex-end;}
.li{width:9px;height:9px;background:var(--fr);clip-path:polygon(50% 0%,100% 38%,82% 100%,50% 80%,18% 100%,0% 38%);box-shadow:0 0 3px var(--fo);}
.li.e{background:rgba(255,255,255,0.07);box-shadow:none;}
#chud{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;}
#scorelbl{font-size:4px;color:rgba(255,255,255,0.25);letter-spacing:2px;}
#scoreval{font-size:12px;color:var(--sg);text-shadow:0 0 12px var(--sg);font-family:'Orbitron',monospace;font-weight:900;letter-spacing:3px;}
#roundlbl{font-size:4px;color:var(--fo);text-shadow:0 0 5px var(--fo);letter-spacing:1px;}
#timerbox{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.84);border:1px solid var(--fo);border-radius:3px;padding:2px 10px;font-size:16px;color:var(--fy);text-shadow:0 0 10px var(--fo);font-family:'Orbitron',monospace;font-weight:700;min-width:52px;text-align:center;}
#timerbox.urg{color:var(--fr);animation:pt 0.5s infinite alternate;}
@keyframes pt{from{box-shadow:0 0 4px var(--fr);}to{box-shadow:0 0 20px var(--fr);}}
#movedisplay{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);font-size:5px;color:var(--fy);text-shadow:0 0 6px var(--fo);letter-spacing:2px;opacity:0;transition:opacity 0.15s;white-space:nowrap;}
#movedisplay.show{opacity:1;}
#bzmtr{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
#bzlbl{font-size:4px;color:var(--fy);text-shadow:0 0 5px var(--fo);letter-spacing:2px;}
#bztrk{width:min(160px,28vw);height:8px;background:rgba(0,0,0,0.7);border:1px solid var(--fo);border-radius:20px;overflow:hidden;}
#bzfil{height:100%;width:0%;background:linear-gradient(90deg,var(--fr),var(--fo),var(--fy));border-radius:20px;box-shadow:0 0 7px var(--fo);transition:width 0.12s;animation:fp 1s ease-in-out infinite alternate;}
@keyframes fp{from{filter:brightness(1);}to{filter:brightness(1.5);}}
#combo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:18px;color:var(--fy);text-shadow:0 0 18px var(--fo),2px 2px 0 rgba(0,0,0,0.9);font-family:'Orbitron',monospace;font-weight:900;opacity:0;pointer-events:none;letter-spacing:3px;}
#combo.show{animation:cpop 0.65s ease-out forwards;}
@keyframes cpop{0%{opacity:1;transform:translate(-50%,-50%) scale(0.5);}60%{opacity:1;transform:translate(-50%,-65%) scale(1.2);}100%{opacity:0;transform:translate(-50%,-85%) scale(1);}}
#tfflash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,130,0,0.9) 0%,transparent 70%);opacity:0;pointer-events:none;z-index:20;}
#tfflash.on{animation:fout 0.9s ease-out forwards;}
@keyframes fout{0%{opacity:1;}100%{opacity:0;}}
.dmgn{position:absolute;font-size:9px;font-family:'Orbitron',monospace;font-weight:700;pointer-events:none;animation:drise 0.85s ease-out forwards;z-index:25;white-space:nowrap;}
@keyframes drise{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-52px) scale(0.6);}}
#koscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 0.4s;z-index:30;pointer-events:none;background:rgba(0,0,0,0.5);}
#koscreen.show{opacity:1;pointer-events:all;}
#kotitle{font-size:clamp(32px,10vw,56px);color:var(--fy);text-shadow:0 0 30px var(--fo),0 0 60px rgba(255,107,0,0.5),4px 4px 0 rgba(0,0,0,0.95);animation:kosh 0.1s ease-in-out 5;}
@keyframes kosh{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
#kosub{font-size:6px;color:rgba(255,255,255,0.45);margin-top:12px;letter-spacing:2px;}
#restart-btn{margin-top:18px;padding:10px 22px;font-size:7px;font-family:'Press Start 2P',monospace;color:#fff;background:var(--fo);border:none;border-radius:4px;box-shadow:0 0 16px var(--fo);pointer-events:all;touch-action:auto;letter-spacing:1px;}
#stglbl{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:4px;color:rgba(255,255,255,0.18);letter-spacing:2px;white-space:nowrap;}
@keyframes sshk{0%,100%{transform:translate(0,0);}20%{transform:translate(-4px,2px);}40%{transform:translate(4px,-2px);}60%{transform:translate(-2px,3px);}80%{transform:translate(2px,-1px);}}
#game-wrap.shk{animation:sshk 0.28s ease-out;}

/* ── TOUCH UI ── */
#touch-ui{position:fixed;bottom:0;left:0;width:100dvw;z-index:50;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;padding-bottom:max(16px,env(safe-area-inset-bottom));}
#jzone{position:relative;width:min(148px,38vw);height:min(148px,38vw);pointer-events:all;touch-action:none;}
#jbase{position:absolute;inset:0;background:rgba(255,107,0,0.06);border:2px solid rgba(255,107,0,0.28);border-radius:50%;box-shadow:0 0 18px rgba(255,107,0,0.09),inset 0 0 28px rgba(0,0,0,0.5);}
#jbase::before,#jbase::after{content:'';position:absolute;background:rgba(255,107,0,0.09);}
#jbase::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#jbase::after{height:2px;width:100%;top:50%;transform:translateY(-50%);}
#jnub{position:absolute;width:min(52px,13vw);height:min(52px,13vw);border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,180,0,0.92),rgba(255,80,0,0.72));border:2px solid rgba(255,200,0,0.5);box-shadow:0 0 16px rgba(255,107,0,0.5),inset 0 0 8px rgba(255,255,255,0.1);top:50%;left:50%;transform:translate(-50%,-50%);transition:transform 0.04s;pointer-events:none;}
.di{position:absolute;font-size:10px;opacity:0.25;pointer-events:none;color:rgba(255,180,0,0.8);transition:opacity 0.1s;}
#di-l{top:50%;left:4px;transform:translateY(-50%);}
#di-r{top:50%;right:4px;transform:translateY(-50%);}
#di-u{left:50%;top:4px;transform:translateX(-50%);}
#di-d{left:50%;bottom:4px;transform:translateX(-50%);}
#jzone.al #di-l,#jzone.ar #di-r,#jzone.au #di-u,#jzone.ad #di-d{opacity:1;}
#btns{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:all;}
.arow{display:flex;gap:8px;align-items:center;}
.abtn{border-radius:50%;border:none;font-family:'Press Start 2P',monospace;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;cursor:pointer;transition:transform 0.05s,filter 0.05s;position:relative;}
.abtn.pressed{transform:scale(0.88) translateY(2px);filter:brightness(1.35);}
.bico{font-size:14px;line-height:1;}
.bl2{font-size:4px;opacity:0.8;letter-spacing:1px;}
#btn-punch{width:min(66px,16vw);height:min(66px,16vw);background:radial-gradient(circle at 35% 30%,#FF9900,#CC2200);box-shadow:0 4px 0 #881100,0 0 18px rgba(255,80,0,0.35);}
#btn-kick{ width:min(62px,15vw);height:min(62px,15vw);background:radial-gradient(circle at 35% 30%,#00BBFF,#0033AA);box-shadow:0 4px 0 #001166,0 0 18px rgba(0,160,255,0.35);}
#btn-jump{ width:min(54px,14vw);height:min(54px,14vw);background:radial-gradient(circle at 35% 30%,#FFEE44,#CC8800);box-shadow:0 4px 0 #664400,0 0 16px rgba(255,200,0,0.35);}
#btn-sp{   width:min(54px,14vw);height:min(54px,14vw);background:radial-gradient(circle at 35% 30%,#DD44FF,#770099);box-shadow:0 4px 0 #440055,0 0 16px rgba(180,0,255,0.35);}
#btn-blk{  width:min(48px,12vw);height:min(48px,12vw);background:radial-gradient(circle at 35% 30%,#888,#333);box-shadow:0 3px 0 #111,0 0 10px rgba(255,255,255,0.12);}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <h1>BLAZEFIST</h1>
  <div class="load-sub">LOADING FROM GITHUB</div>
  <div id="prog-wrap"><div id="prog-fill"></div></div>
  <div id="load-status">Initializing engine...</div>
  <div id="load-assets"></div>
</div>

<!-- GAME CANVAS -->
<div id="scale-root">
  <div id="game-wrap">
    <canvas id="game-canvas" width="768" height="512"></canvas>
    <div id="hud">
      <div class="panel pl">
        <div class="fname" id="p1-name">BLAZEFIST</div>
        <div class="brow"><div class="blbl">HP</div><div class="btrk"><div class="tks"></div><div class="bfil" id="p1-hp" style="width:100%"></div></div></div>
        <div class="brow"><div class="blbl">XP</div><div class="btrk"><div class="tks"></div><div class="bfil" id="p1-xp" style="width:0%"></div></div></div>
        <div class="lrow"><div class="li"></div><div class="li"></div><div class="li"></div></div>
      </div>
      <div class="panel pr">
        <div class="fname" id="p2-name">SHADOW</div>
        <div class="brow"><div class="blbl" style="text-align:right">HP</div><div class="btrk"><div class="tks"></div><div class="bfil" id="p2-hp" style="width:100%"></div></div></div>
        <div class="brow"><div class="blbl" style="text-align:right">STAM</div><div class="btrk"><div class="tks"></div><div class="bfil" id="p2-st" style="width:80%"></div></div></div>
        <div class="lrow"><div class="li"></div><div class="li"></div><div class="li"></div></div>
      </div>
      <div id="chud"><div id="scorelbl">SCORE</div><div id="scoreval">000000</div><div id="roundlbl">ROUND 1</div></div>
      <div id="timerbox">99</div>
      <div id="movedisplay"></div>
      <div id="bzmtr"><div id="bzlbl">◈ BLAZE METER ◈</div><div id="bztrk"><div id="bzfil"></div></div></div>
      <div id="combo"></div>
      <div id="tfflash"></div>
      <div id="stglbl">STAGE 1</div>
      <div id="koscreen">
        <div id="kotitle">K·O</div>
        <div id="kosub">TAP TO CONTINUE</div>
        <button id="restart-btn">▶ NEXT ROUND</button>
      </div>
    </div>
  </div>
</div>

<!-- TOUCH CONTROLS -->
<div id="touch-ui">
  <div id="jzone">
    <div id="jbase">
      <span class="di" id="di-l">◀</span><span class="di" id="di-r">▶</span>
      <span class="di" id="di-u">▲</span><span class="di" id="di-d">▼</span>
    </div>
    <div id="jnub"></div>
  </div>
  <div id="btns">
    <div class="arow">
      <div class="abtn" id="btn-jump"><span class="bico">↑</span><span class="bl2">JUMP</span></div>
      <div class="abtn" id="btn-sp"><span class="bico">✦</span><span class="bl2">SP</span></div>
    </div>
    <div class="arow">
      <div class="abtn" id="btn-blk"><span class="bico">🛡</span><span class="bl2">BLK</span></div>
      <div class="abtn" id="btn-kick"><span class="bico">🦵</span><span class="bl2">KICK</span></div>
      <div class="abtn" id="btn-punch"><span class="bico">👊</span><span class="bl2">PUNCH</span></div>
    </div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  BLAZEFIST  index.html  —  ES Module Entry Point
// ═══════════════════════════════════════════════════════════════
import { UniversalClock, LAYER, PARSE_MODE }
  from './assets/js/esmodules/universalclock.js';
import { AnimDef }
  from './assets/js/esmodules/playclock.js';

// ── Service Worker Registration ────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' })
    .then(r => console.log('[SW] registered:', r.scope))
    .catch(e => console.warn('[SW] failed:', e));
}

// ── Constants ─────────────────────────────────────────────────
const GH      = 'https://raw.githubusercontent.com/beardsleycaleb3-afk/fight/main/';
const SP_BASE = GH + 'assets/sprites/fighter/';
const BG_BASE = GH + 'assets/sprites/stages/backgrounds/';
const MP4_32HIT = GH + 'assets/sprites/fighter/east/32hitnormal.mp4';

const NW = 768, NH = 512, GND = 370, GRAV = 0.56, JMP = -13.5;

// ── Exact frame counts from repo screenshots ──────────────────
const ANIM_DEFS_RAW = {
  // Normal fighter (east/)
  n_idle:      { path:'east/idle',       n:null, fps:6,  loop:true  },
  n_run:       { path:'east/run',        n:8,    fps:10, loop:true  },
  n_crouch:    { path:'east/crouch',     n:null, fps:6,  loop:true  },
  n_jab:       { path:'east/jab',        n:null, fps:14, loop:false },
  n_kick:      { path:'east/kick',       n:7,    fps:14, loop:false },
  n_cross:     { path:'east/cross',      n:null, fps:14, loop:false },
  n_uppercut:  { path:'east/uppercut',   n:7,    fps:16, loop:false },
  n_fireball:  { path:'east/fireball',   n:null, fps:12, loop:false },
  n_die:       { path:'east/die',        n:null, fps:8,  loop:false },
  n_getup:     { path:'east/getup',      n:null, fps:8,  loop:false },
  n_takehit:   { path:'east/takehit',    n:6,    fps:12, loop:false },
  n_throw:     { path:'east/throw',      n:7,    fps:12, loop:false },
  n_transform: { path:'east/transform',  n:13,   fps:10, loop:false },
  // Flaming fighter (flaming/east/)
  f_idle:      { path:'flaming/east/idle',       n:8,  fps:6,  loop:true  },
  f_walk:      { path:'flaming/east/walk',        n:8,  fps:8,  loop:true  },
  f_run:       { path:'flaming/east/run',         n:8,  fps:12, loop:true  },
  f_jab:       { path:'flaming/east/jab',         n:3,  fps:16, loop:false },
  f_kick:      { path:'flaming/east/kick',        n:6,  fps:16, loop:false },
  f_punch:     { path:'flaming/east/punch',       n:6,  fps:18, loop:false },
  f_cross:     { path:'flaming/east/cross',       n:6,  fps:16, loop:false },
  f_uppercut:  { path:'flaming/east/uppercut',    n:7,  fps:18, loop:false },
  f_roundhouse:{ path:'flaming/east/roundhouse',  n:7,  fps:14, loop:false },
  f_headbutt:  { path:'flaming/east/headbutt',    n:11, fps:14, loop:false },
  f_jump:      { path:'flaming/east/jump',        n:8,  fps:10, loop:false },
  f_victory:   { path:'flaming/east/victory',     n:13, fps:8,  loop:true  },
};

// ── Asset loader ──────────────────────────────────────────────
const FRAMES = {};   // key → HTMLImageElement[]
const BGIMGS = {};   // 'stage1'...'stage9' → HTMLImageElement

const setStatus = t => document.getElementById('load-status').textContent = t;
const setAssets = t => document.getElementById('load-assets').textContent = t;
const setProg   = p => document.getElementById('prog-fill').style.width = (p*100).toFixed(1)+'%';

function loadImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload  = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

async function loadAnimFrames(key, def) {
  const frames = [];
  const maxN   = def.n ?? 16;
  const jobs   = [];
  for (let i = 0; i < maxN; i++) {
    const f = String(i).padStart(3,'0');
    jobs.push(loadImg(`${SP_BASE}${def.path}/frame_${f}.png`));
  }
  const results = await Promise.all(jobs);
  for (const img of results) {
    if (img) frames.push(img); else break;
  }
  return frames;
}

async function loadAllAssets() {
  const keys   = Object.keys(ANIM_DEFS_RAW);
  const total  = keys.length + 9; // anims + 9 stages
  let   loaded = 0;

  // Load stage backgrounds 1-9
  setStatus('Loading stages...');
  for (let i = 1; i <= 9; i++) {
    BGIMGS[`stage${i}`] = await loadImg(`${BG_BASE}stage${i}.png`);
    loaded++;
    setProg(loaded/total);
    setAssets(`stage${i}.png`);
  }

  // Load animation frame sets
  for (const key of keys) {
    setStatus(`Loading: ${key.replace('_',' / ')} ...`);
    FRAMES[key] = await loadAnimFrames(key, ANIM_DEFS_RAW[key]);
    setAssets(`${FRAMES[key].length} frames loaded`);
    loaded++;
    setProg(loaded/total);
  }

  setProg(1);
  setStatus('Ready!');
  await new Promise(r => setTimeout(r, 350));
  const loader = document.getElementById('loader');
  loader.classList.add('fade');
  setTimeout(() => loader.style.display='none', 650);
}

// ── Canvas / Clock setup ──────────────────────────────────────
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Viewport scaling
function resize() {
  const s = Math.min(window.innerWidth/NW, window.innerHeight/NH);
  const w = document.getElementById('game-wrap');
  w.style.width     = NW+'px';
  w.style.height    = NH+'px';
  w.style.transform = `scale(${s})`;
}
resize();
window.addEventListener('resize', resize);
try{ screen.orientation.addEventListener('change',()=>setTimeout(resize,120)); }catch(e){}

// ── Universal Clock ───────────────────────────────────────────
const uclock = new UniversalClock({ canvas, gameFps: 60 });

// ── MP4 video setup (32hitnormal.mp4) ────────────────────────
// This video plays as a special 32-hit combo effect overlay.
// We use LIVE mode so it streams directly to canvas on demand.
let mp4Parser  = null;
let mp4Playing = false;
let mp4Timer   = 0;

uclock.loadVideo('32hitnormal', MP4_32HIT, {
  mode:       PARSE_MODE.LIVE,   // stream live (no pre-extraction needed)
  frameWidth:  768,
  frameHeight: 512,
}).then(parser => {
  mp4Parser = parser;
  console.log('[MP4] 32hitnormal ready, duration:', parser.duration.toFixed(2)+'s');
}).catch(e => console.warn('[MP4] load failed:', e));

// ── Stages ───────────────────────────────────────────────────
const STAGES = [
  { k:'stage1', lbl:'STAGE 1 — ARENA OF CHAOS'   },
  { k:'stage2', lbl:'STAGE 2 — SHADOW TEMPLE'     },
  { k:'stage3', lbl:'STAGE 3 — MONSTER CONCERT'   },
  { k:'stage4', lbl:'STAGE 4'                     },
  { k:'stage5', lbl:'STAGE 5'                     },
  { k:'stage6', lbl:'STAGE 6'                     },
  { k:'stage7', lbl:'STAGE 7'                     },
  { k:'stage8', lbl:'STAGE 8'                     },
  { k:'stage9', lbl:'STAGE 9 — FINAL SHOWDOWN'    },
];
let si = 0;

// ── Input (touch only) ───────────────────────────────────────
const T = { left:false,right:false,up:false,down:false,punch:false,kick:false,sp:false,block:false };
let punchTaps=0, punchTapTs=0;

const jzone=document.getElementById('jzone');
const jnub =document.getElementById('jnub');
let jID=null,jOx=0,jOy=0;
const JRAD=Math.min(74,window.innerWidth*0.19), DZ=16;

jzone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  const r=jzone.getBoundingClientRect();
  jOx=r.left+r.width/2; jOy=r.top+r.height/2;
  jID=t.identifier; jCalc(t);
},{passive:false});
jzone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===jID) jCalc(t);
},{passive:false});
const jOff=e=>{
  e.preventDefault();
  for(const t of e.changedTouches) if(t.identifier===jID){
    jID=null; T.left=T.right=T.up=T.down=false;
    jnub.style.transform='translate(-50%,-50%)';
    jzone.className='';
  }
};
jzone.addEventListener('touchend',jOff,{passive:false});
jzone.addEventListener('touchcancel',jOff,{passive:false});

function jCalc(t) {
  let dx=t.clientX-jOx, dy=t.clientY-jOy;
  const d=Math.hypot(dx,dy);
  if(d>JRAD){dx=dx/d*JRAD;dy=dy/d*JRAD;}
  jnub.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
  T.left=dx<-DZ; T.right=dx>DZ; T.up=dy<-DZ*1.3; T.down=dy>DZ;
  jzone.className=[T.left&&'al',T.right&&'ar',T.up&&'au',T.down&&'ad'].filter(Boolean).join(' ');
}

function wireBtn(id,flag,onDown) {
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{
    e.preventDefault(); e.stopPropagation();
    T[flag]=true; el.classList.add('pressed');
    onDown?.();
  },{passive:false});
  const off=e=>{e.preventDefault();T[flag]=false;el.classList.remove('pressed');};
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
}
wireBtn('btn-punch','punch',()=>{
  const now=Date.now();
  punchTaps=(now-punchTapTs<500)?punchTaps+1:1;
  punchTapTs=now;
});
wireBtn('btn-kick','kick');
wireBtn('btn-jump','up');
wireBtn('btn-sp','sp');
wireBtn('btn-blk','block');

document.getElementById('restart-btn').addEventListener('touchstart',e=>{
  e.preventDefault(); if(state!=='fight') restart();
},{passive:false});

// ── Game state ───────────────────────────────────────────────
let player,enemy,score,round,timer,timerTick,state,particles,aiT,aiAct;

function mkF(x,y,facing,isP){
  return{x,y,vx:0,vy:0,facing,onGround:true,
    hp:100,maxHp:100,xp:0,maxXp:100,lives:3,
    transformed:false,tfT:0,
    anim:'n_idle',af:0,at:0,
    atkCD:0,hurtT:0,blockT:0,
    isPlayer:isP,groundY:y,
    comboN:0,comboT:0,fireballs:[]};
}

function initAll(){
  player=mkF(190,GND,1,true);
  enemy =mkF(578,GND,-1,false);
  score=0;round=1;timer=99;timerTick=0;
  state='fight';particles=[];aiT=0;aiAct='idle';
  mp4Playing=false;mp4Timer=0;
  updScore();
}

// ── Particles ────────────────────────────────────────────────
function spark(x,y,blaze,n=14){
  const c=blaze?['#FF6B00','#FFD600','#FF4400','#FFA500']:['#FF6B00','#FFD600','#fff','#FF4400'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,
      life:1,dec:0.032+Math.random()*0.04,sz:2+Math.random()*4,
      col:c[Math.floor(Math.random()*c.length)]});
  }
}
function updP(){ particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life-=p.dec;return p.life>0;}); }
function drawP(){
  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=10;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);ctx.restore();
  });
}

// ── Anim step ────────────────────────────────────────────────
function stepAnim(f,dt){
  const def=ANIM_DEFS_RAW[f.anim];
  if(!def)return;
  f.at+=dt;
  const fd=1000/def.fps;
  if(f.at>=fd){
    f.at-=fd; f.af++;
    const frms=FRAMES[f.anim]||[];
    if(f.af>=(frms.length||1)){
      if(def.loop)f.af=0;
      else{f.af=Math.max(0,(frms.length||1)-1);animEnd(f);}
    }
  }
}
function animEnd(f){
  const a=f.anim;
  if(a==='n_transform'){sa(f,'f_idle');}
  else if(a==='n_die'||a==='f_victory'){}
  else sa(f,f.transformed?'f_idle':'n_idle');
}
function sa(f,anim){if(f.anim!==anim){f.anim=anim;f.af=0;f.at=0;}}
function idle(f){sa(f,f.transformed?'f_idle':'n_idle');}

// ── Draw fighter ─────────────────────────────────────────────
function drawFighter(f){
  const frms=FRAMES[f.anim]||[];
  if(!frms.length)return;
  const img=frms[Math.min(f.af,frms.length-1)];
  if(!img)return;
  const FW=92,FH=92,dx=f.x-FW/2,dy=f.y-FH;
  ctx.save();
  if(f.facing<0){ctx.translate(f.x,0);ctx.scale(-1,1);ctx.translate(-f.x,0);}
  ctx.drawImage(img,dx,dy,FW,FH);
  if(f.transformed){
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(255,80,0,0.45)';ctx.fillRect(dx,dy,FW,FH);
    const g=ctx.createRadialGradient(f.x,f.y-FH/2,6,f.x,f.y-FH/2,55);
    g.addColorStop(0,'rgba(255,130,0,0.28)');g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(dx-20,dy-20,FW+40,FH+40);
    ctx.globalCompositeOperation='source-over';
  }
  if(f.blockT>0){
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgba(0,180,255,0.22)';ctx.fillRect(dx,dy,FW,FH);
    ctx.globalCompositeOperation='source-over';
  }
  if(f.hurtT>0&&Math.floor(f.hurtT/3)%2===0){
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.72;
    ctx.fillStyle='rgba(255,0,0,1)';ctx.fillRect(dx,dy,FW,FH);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=0.2;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(f.x,GND+3,22,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
}

// ── MP4 overlay (32hitnormal) ────────────────────────────────
function drawMp4Overlay(){
  if(!mp4Playing||!mp4Parser?.ready)return;
  mp4Timer--;
  if(mp4Timer<=0){mp4Playing=false;mp4Parser.pauseLive();return;}
  ctx.save();
  ctx.globalAlpha=Math.min(1,mp4Timer/30)*0.6;
  mp4Parser.drawLive(ctx,0,0,NW,NH);
  ctx.restore();
}

function triggerMp4(durationFrames=180){
  if(!mp4Parser?.ready)return;
  mp4Playing=true;mp4Timer=durationFrames;
  mp4Parser.video.currentTime=0;
  mp4Parser.playLive();
}

// ── Attack / hit ─────────────────────────────────────────────
function hitTarget(att,tgt,dmg){
  if(tgt.blockT>0){
    dmg=dmg*0.2|0;
    showDmg(tgt.x,tgt.y-60,dmg,false,'BLK');
    spark(tgt.x,tgt.y-50,false,5);
    return;
  }
  tgt.hp=Math.max(0,tgt.hp-dmg);tgt.hurtT=20;
  if(att.isPlayer){
    player.xp=Math.min(100,player.xp+14);
    score+=dmg*10*(player.transformed?2:1)*(player.comboN+1);
    player.comboN++;player.comboT=90;
    updScore();showCombo(player.comboN);
    showDmg(tgt.x,tgt.y-60,dmg,att.transformed);
    // Trigger MP4 overlay on big combos
    if(player.comboN>=5) triggerMp4(120);
  }
  spark(tgt.x,tgt.y-50,att.transformed);
  shake();
  if(tgt.hp<=0)trigKO(att.isPlayer);
}

function doAtk(att,tgt,moveName,dmgBase,reach){
  if(att.atkCD>0||Math.abs(att.x-tgt.x)>reach)return false;
  att.atkCD=att.transformed?20:32;
  const dmg=((dmgBase+Math.random()*6|0)*(att.transformed?1.65:1))|0;
  hitTarget(att,tgt,dmg);
  if(moveName)showMove(moveName);
  return true;
}

// ── Fireball ─────────────────────────────────────────────────
function spawnFB(f){
  f.fireballs.push({x:f.x+f.facing*30,y:f.y-45,vx:f.facing*8,life:1,dec:0.008});
  showMove('FIREBALL!');
}
function updFBs(f,tgt){
  f.fireballs=f.fireballs.filter(fb=>{
    fb.x+=fb.vx;fb.life-=fb.dec;
    if(Math.abs(fb.x-tgt.x)<40&&Math.abs(fb.y-(tgt.y-45))<55){
      hitTarget(f,tgt,(18+Math.random()*8|0));return false;
    }
    return fb.x>-60&&fb.x<828&&fb.life>0;
  });
}
function drawFBs(f){
  f.fireballs.forEach(fb=>{
    ctx.save();ctx.globalAlpha=fb.life;ctx.font='22px serif';
    ctx.shadowColor='#FF6B00';ctx.shadowBlur=20;
    ctx.fillText('🔥',fb.x-11,fb.y+8);ctx.restore();
  });
}

// ── Player moves ─────────────────────────────────────────────
function execMove(){
  if(player.atkCD>0)return;
  const fl=player.transformed;
  if(T.sp){
    if(fl){if(doAtk(player,enemy,'ROUNDHOUSE!',18,155))sa(player,'f_roundhouse');}
    else if(player.xp>=30){sa(player,'n_fireball');spawnFB(player);player.atkCD=45;player.xp=Math.max(0,player.xp-30);}
    return;
  }
  if(T.punch){
    if(fl){
      if(punchTaps>=3&&doAtk(player,enemy,'UPPERCUT!',22,120)){sa(player,'f_uppercut');}
      else if(punchTaps>=2&&doAtk(player,enemy,'CROSS!',16,120)){sa(player,'f_cross');}
      else if(doAtk(player,enemy,'JAB!',10,115)){sa(player,'f_jab');}
    } else {
      if(punchTaps>=3&&doAtk(player,enemy,'UPPERCUT!',18,110)){sa(player,'n_uppercut');}
      else if(punchTaps>=2&&doAtk(player,enemy,'CROSS!',13,110)){sa(player,'n_cross');}
      else if(doAtk(player,enemy,'JAB!',8,110)){sa(player,'n_jab');}
    }
    return;
  }
  if(T.kick){
    if(fl){if(doAtk(player,enemy,'KICK!',14,132)){sa(player,'f_kick');}}
    else  {if(doAtk(player,enemy,'KICK!',11,132)){sa(player,'n_kick');}}
  }
}

// ── AI ───────────────────────────────────────────────────────
function updAI(){
  aiT--;
  const dist=Math.abs(enemy.x-player.x);
  if(aiT<=0){
    const r=Math.random();
    aiAct=dist>185?'chase':r<0.3?'attack':r<0.55?'retreat':r<0.7?'crouch':'idle';
    aiT=280+Math.random()*480|0;
  }
  const spd=enemy.transformed?2.7:2.0;
  if(aiAct==='chase'){enemy.vx=(player.x>enemy.x?1:-1)*spd;sa(enemy,enemy.transformed?'f_run':'n_run');}
  else if(aiAct==='retreat'){enemy.vx=(player.x>enemy.x?-1:1)*spd;sa(enemy,enemy.transformed?'f_walk':'n_run');}
  else if(aiAct==='attack'){
    enemy.vx*=0.55;
    if(dist<130&&enemy.atkCD<=0){
      const r=Math.random();
      let hit=false;
      if(r<0.35){hit=doAtk(enemy,player,'',10,132);if(hit)sa(enemy,enemy.transformed?'f_kick':'n_kick');}
      else if(r<0.65){hit=doAtk(enemy,player,'',8,120);if(hit)sa(enemy,enemy.transformed?'f_jab':'n_jab');}
      else if(r<0.85){hit=doAtk(enemy,player,'',14,120);if(hit)sa(enemy,enemy.transformed?'f_cross':'n_cross');}
      else if(!enemy.transformed&&enemy.xp>=30){sa(enemy,'n_fireball');spawnFB(enemy);enemy.atkCD=45;enemy.xp=Math.max(0,enemy.xp-30);}
      if(!hit)idle(enemy);
    }
  } else if(aiAct==='crouch'){enemy.vx*=0.6;sa(enemy,'n_crouch');}
  else{enemy.vx*=0.75;idle(enemy);}
}

// ── Update player ─────────────────────────────────────────────
function updPlayer(){
  const fl=player.transformed;
  const spd=fl?3.5:2.6;
  if(T.left){player.vx=-spd;player.facing=-1;}
  else if(T.right){player.vx=spd;player.facing=1;}
  else player.vx*=0.6;
  if(T.up&&player.onGround&&!T.block){
    player.vy=JMP*(fl?1.12:1);player.onGround=false;
    if(fl)sa(player,'f_jump');
  }
  player.blockT=T.block&&player.onGround?8:0;
  if(T.down&&player.onGround&&!T.block)sa(player,'n_crouch');
  execMove();
  player.vy+=GRAV;player.y+=player.vy;player.x+=player.vx;
  if(player.y>=player.groundY){player.y=player.groundY;player.vy=0;player.onGround=true;}
  player.x=Math.max(46,Math.min(722,player.x));
  if(!T.left&&!T.right)player.facing=enemy.x>player.x?1:-1;
  const atkAnims=['n_jab','n_kick','n_cross','n_uppercut','n_fireball','n_throw',
                  'f_jab','f_kick','f_punch','f_cross','f_uppercut','f_roundhouse','f_headbutt','f_jump'];
  if(player.onGround&&!atkAnims.includes(player.anim)&&!T.block&&!T.down){
    sa(player,fl?(Math.abs(player.vx)>0.4?'f_walk':'f_idle'):(Math.abs(player.vx)>0.4?'n_run':'n_idle'));
  }
  if(player.atkCD>0)player.atkCD--;
  if(player.hurtT>0)player.hurtT--;
  if(player.comboT>0){player.comboT--;if(!player.comboT)player.comboN=0;}
  if(player.tfT>0){player.tfT--;if(!player.tfT){player.transformed=false;idle(player);document.getElementById('p1-name').textContent='BLAZEFIST';}}
  if(player.xp>=100&&!player.transformed)trigTF();
  updFBs(player,enemy);
}
function updEnemy(){
  updAI();
  enemy.vy+=GRAV;enemy.y+=enemy.vy;enemy.x+=enemy.vx;
  if(enemy.y>=enemy.groundY){enemy.y=enemy.groundY;enemy.vy=0;enemy.onGround=true;}
  enemy.x=Math.max(46,Math.min(722,enemy.x));
  enemy.facing=player.x>enemy.x?1:-1;
  if(enemy.atkCD>0)enemy.atkCD--;
  if(enemy.hurtT>0)enemy.hurtT--;
  enemy.xp=Math.min(100,enemy.xp+0.05);
  if(enemy.xp>=100&&!enemy.transformed){enemy.transformed=true;enemy.tfT=360;enemy.xp=0;sa(enemy,'f_idle');}
  if(enemy.tfT>0){enemy.tfT--;if(!enemy.tfT){enemy.transformed=false;idle(enemy);}}
  updFBs(enemy,player);
}

// ── Transform ────────────────────────────────────────────────
function trigTF(){
  player.transformed=true;player.tfT=600;player.xp=0;
  sa(player,'n_transform');
  document.getElementById('p1-name').textContent='🔥 BLAZEFIST';
  const fl=document.getElementById('tfflash');
  fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
  showMove('🔥 BLAZE TRANSFORM!');
  spark(player.x,player.y-50,true,30);
}

// ── HUD ──────────────────────────────────────────────────────
function updHUD(){
  const pp=player.hp/player.maxHp*100;
  const hpEl=document.getElementById('p1-hp');
  hpEl.style.width=pp+'%';
  hpEl.style.background=pp>50?'linear-gradient(90deg,#004400,var(--hg))':pp>25?'linear-gradient(90deg,#664400,var(--hy))':'linear-gradient(90deg,#440000,var(--hr))';
  document.getElementById('p1-xp').style.width=player.xp+'%';
  document.getElementById('p2-hp').style.width=(enemy.hp/enemy.maxHp*100)+'%';
  document.getElementById('bzfil').style.width=player.xp+'%';
}
function updScore(){document.getElementById('scoreval').textContent=String(score).padStart(6,'0');}
function updTimer(){
  if(++timerTick<60)return;timerTick=0;timer=Math.max(0,timer-1);
  const el=document.getElementById('timerbox');
  el.textContent=String(timer).padStart(2,'0');
  el.classList.toggle('urg',timer<=10);
  if(!timer)trigKO(player.hp>enemy.hp);
}

let movTO=null;
function showMove(t){
  const el=document.getElementById('movedisplay');
  el.textContent=t;el.classList.add('show');
  if(movTO)clearTimeout(movTO);
  movTO=setTimeout(()=>el.classList.remove('show'),850);
}
function showCombo(n){
  if(n<2)return;
  const el=document.getElementById('combo');
  el.textContent=n+'x HIT!';el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
function showDmg(x,y,dmg,blaze,lbl){
  const d=document.createElement('div');d.className='dmgn';
  const col=blaze?'#FFD600':'#FF5555';
  d.style.cssText=`left:${x-18}px;top:${y}px;color:${col};text-shadow:0 0 8px ${blaze?'#FF6B00':'#FF0000'};`;
  d.textContent=lbl?lbl:(blaze?'🔥':'')+dmg;
  document.getElementById('hud').appendChild(d);
  setTimeout(()=>d.remove(),850);
}

function shake(){
  const w=document.getElementById('game-wrap');
  w.classList.remove('shk');void w.offsetWidth;w.classList.add('shk');
  setTimeout(()=>w.classList.remove('shk'),280);
}

// ── KO ───────────────────────────────────────────────────────
function trigKO(pWon){
  state='ko';
  document.getElementById('kotitle').textContent=pWon?'K·O':'DEFEAT';
  document.getElementById('koscreen').classList.add('show');
  if(pWon)triggerMp4(300); // celebrate with 32-hit video
}
function restart(){
  round++;si=(si+1)%STAGES.length;
  document.getElementById('stglbl').textContent=STAGES[si].lbl;
  document.getElementById('roundlbl').textContent='ROUND '+round;
  document.getElementById('koscreen').classList.remove('show');
  player=mkF(190,GND,1,true);enemy=mkF(578,GND,-1,false);
  timer=99;timerTick=0;particles=[];state='fight';
  mp4Playing=false;mp4Timer=0;mp4Parser?.pauseLive();
  updScore();document.getElementById('p1-name').textContent='BLAZEFIST';
}

// ── Draw stage ───────────────────────────────────────────────
function drawStage(){
  const img=BGIMGS[STAGES[si].k];
  if(img){ctx.drawImage(img,0,0,NW,NH);}
  else{
    const g=ctx.createLinearGradient(0,0,0,NH);
    g.addColorStop(0,'#1a0530');g.addColorStop(1,'#0a0a18');
    ctx.fillStyle=g;ctx.fillRect(0,0,NW,NH);
  }
}

// ── Render layers (wired into UniversalClock) ─────────────────
uclock.addLayer('stage',      LAYER.BACKGROUND, ()=>{ drawStage(); });
uclock.addLayer('fireballs',  LAYER.PROJECTILE, ()=>{ drawFBs(player);drawFBs(enemy); });
uclock.addLayer('particles',  LAYER.PARTICLE,   ()=>{ drawP(); });
uclock.addLayer('fighters',   LAYER.SPRITE,     ()=>{ drawFighter(player);drawFighter(enemy); });
uclock.addLayer('mp4overlay', LAYER.OVERLAY,    ()=>{ drawMp4Overlay(); });

// ── Fixed update (wired into GameClock) ──────────────────────
uclock.onUpdate((dt) => {
  if(state!=='fight')return;
  updPlayer(); updEnemy(); updTimer(); updP();
});

// ── Render tick (HUD updates, anim step) ─────────────────────
uclock.render.addPreHook(() => {
  if(state!=='fight')return;
  stepAnim(player,uclock.game.delta);
  stepAnim(enemy, uclock.game.delta);
  updHUD();
});

// ── Boot ──────────────────────────────────────────────────────
loadAllAssets().then(() => {
  initAll();
  uclock.start();
});
</script>
